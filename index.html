<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Corner Store Roofing</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style id="app-style">
/* Layout: measured roofline. A slate hero edged by a tape-measure rule, quiet galvanized-grey sections below, and a plain two-pane work surface for the owner dashboard. */
:root{
  --brand:#F1B51C; --on-brand:#17191B;
  --ground:#EFF1F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --sunk:#E4E8EB;
  --ink:#17202A; --ink-2:#33404B; --muted:#5B6772; --line:#D5DADF; --line-2:#E4E7EA;
  --slate:#1C2731; --slate-2:#26333F; --slate-ink:#EEF2F5; --slate-muted:#A8B4BE; --slate-line:#354552;
  --sh1:#3B4956; --sh2:#34414D; --sh3:#2C3842; --wall:#C7CED4; --wall-2:#B3BBC2; --trim:#EEF1F3;
  --accent-ink:color-mix(in oklab, var(--brand) 48%, #15191C);
  --focus:color-mix(in oklab, var(--brand) 65%, #15191C);
  --st-new:#2A66AE; --st-insp:#6A4CB4; --st-est:#946500; --st-won:#1C7247; --st-prog:#0D6F78; --st-done:#4E5C68; --st-lost:#A3392F;
  --good:#1C7247; --warn:#946500; --bad:#A3392F;
  --scrim:rgb(12 17 22 / .5);
  --shadow:0 1px 2px rgb(16 24 32 / .06), 0 10px 28px rgb(16 24 32 / .10);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px; --r-sm:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10161B; --surface:#172029; --surface-2:#1C2630; --sunk:#0C1216;
    --ink:#E5EAEE; --ink-2:#C3CCD3; --muted:#93A0AB; --line:#2A3540; --line-2:#222C35;
    --slate:#0B1115; --slate-2:#141C23; --slate-ink:#EEF2F5; --slate-muted:#9BA8B2; --slate-line:#24303A;
    --sh1:#36434F; --sh2:#2F3B46; --sh3:#27323C; --wall:#4B5763; --wall-2:#3E4955; --trim:#CBD3D9;
    --accent-ink:color-mix(in oklab, var(--brand) 62%, #FFFFFF);
    --focus:color-mix(in oklab, var(--brand) 80%, #FFFFFF);
    --st-new:#82B2EC; --st-insp:#B6A0F1; --st-est:#E7B24C; --st-won:#62C994; --st-prog:#56C4CD; --st-done:#A5B2BD; --st-lost:#EF8C82;
    --good:#62C994; --warn:#E7B24C; --bad:#EF8C82;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 32px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#10161B; --surface:#172029; --surface-2:#1C2630; --sunk:#0C1216;
  --ink:#E5EAEE; --ink-2:#C3CCD3; --muted:#93A0AB; --line:#2A3540; --line-2:#222C35;
  --slate:#0B1115; --slate-2:#141C23; --slate-ink:#EEF2F5; --slate-muted:#9BA8B2; --slate-line:#24303A;
  --sh1:#36434F; --sh2:#2F3B46; --sh3:#27323C; --wall:#4B5763; --wall-2:#3E4955; --trim:#CBD3D9;
  --accent-ink:color-mix(in oklab, var(--brand) 62%, #FFFFFF);
  --focus:color-mix(in oklab, var(--brand) 80%, #FFFFFF);
  --st-new:#82B2EC; --st-insp:#B6A0F1; --st-est:#E7B24C; --st-won:#62C994; --st-prog:#56C4CD; --st-done:#A5B2BD; --st-lost:#EF8C82;
  --good:#62C994; --warn:#E7B24C; --bad:#EF8C82;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 32px rgb(0 0 0 / .4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding:0}
button{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.eyebrow{font:500 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";flex:none;width:17px;height:10px;opacity:.85;background:
  linear-gradient(currentColor,currentColor) 0 100%/1px 10px no-repeat,
  linear-gradient(currentColor,currentColor) 8px 100%/1px 5px no-repeat,
  linear-gradient(currentColor,currentColor) 16px 100%/1px 10px no-repeat,
  linear-gradient(currentColor,currentColor) 0 100%/17px 1px no-repeat}
.eyebrow.on-dark{color:var(--slate-muted)}
.display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.95}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:15px;line-height:1.1;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
label.btn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.btn-brand{background:var(--brand);color:var(--on-brand);border-color:color-mix(in oklab,var(--brand) 78%,var(--ink))}
.btn-brand:hover:not(:disabled){background:color-mix(in oklab,var(--brand) 86%,var(--ink))}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--muted)}
.btn-dark{background:var(--ink);color:var(--surface)}
.btn-dark:hover:not(:disabled){background:var(--ink-2)}
.btn-outline-dark{background:transparent;border-color:var(--slate-line);color:var(--slate-ink)}
.btn-outline-dark:hover{border-color:var(--slate-muted)}
.btn-danger{background:var(--bad);color:var(--surface)}
.btn-lg{min-height:50px;padding:0 24px;font-size:16px}
.btn-sm{min-height:34px;padding:0 12px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link.muted{color:var(--muted)}
.icon-btn{width:34px;height:34px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.icon-btn:hover:not(:disabled){border-color:var(--muted);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* alert + header */
.alert{background:var(--slate);color:var(--slate-ink);font-size:14px;border-bottom:1px solid var(--slate-line)}
.alert-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:9px}
.alert-tag{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--brand);color:var(--on-brand);padding:5px 8px;border-radius:3px}
.alert-phone{font-weight:700;text-decoration:none;margin-left:auto;font-variant-numeric:tabular-nums;color:var(--slate-ink)}
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in oklab,var(--surface) 93%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(10px);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line-2)}
.head-in{display:flex;align-items:center;gap:18px;min-height:68px}
.brandmark{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.mark{width:38px;height:38px;flex:none;display:block}
.mark .m-bg{fill:var(--ink)} .mark .m-roof{fill:none;stroke:var(--brand);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.mark .m-wall{fill:none;stroke:var(--surface);stroke-width:2.4;stroke-linejoin:round} .mark .m-door{fill:var(--brand)}
.logo-img{height:40px;width:auto;max-width:140px;object-fit:contain;display:block}
.word{display:flex;flex-direction:column;line-height:.9;min-width:0}
.word b{font:800 23px/.9 var(--f-display);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word small{font:500 10px/1 var(--f-mono);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.site-nav{display:flex;gap:2px;margin-left:8px}
.site-nav button{background:none;border:0;padding:8px 10px;border-radius:var(--r-sm);font-weight:500;color:var(--ink-2);cursor:pointer;font-size:15px}
.site-nav button:hover{background:var(--sunk);color:var(--ink)}
.head-cta{margin-left:auto;display:flex;align-items:center;gap:10px}
.head-phone{display:flex;flex-direction:column;text-decoration:none;line-height:1.15;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;margin-right:4px}
.head-phone .lbl{font:500 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn .short{display:none}
@media (max-width:1020px){.site-nav{display:none}}
@media (max-width:640px){.head-phone{display:none}}
@media (max-width:460px){.word small{display:none}.word b{font-size:20px}.btn .long{display:none}.btn .short{display:inline}.head-cta .btn{padding:0 12px}.head-in{gap:10px}}

/* hero */
.hero{background:var(--slate);color:var(--slate-ink);position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:60px 52px}
@media (max-width:900px){.hero-in{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:44px 36px}}
.hero h1{font:800 clamp(2.6rem,6.4vw,5.1rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin-top:18px;max-width:13ch}
.lede{margin-top:20px;font-size:clamp(1.05rem,1.5vw,1.2rem);color:var(--slate-muted);max-width:46ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chips{list-style:none;margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 20px}
.chips li{font-size:14px;display:flex;align-items:center;gap:9px}
.chips li::before{content:"";width:7px;height:7px;background:var(--brand);transform:rotate(45deg);flex:none}
.hero-art{min-width:0}
.house{width:100%;height:auto;display:block;max-width:100%}
.house .sh1{fill:var(--sh1)} .house .sh2{fill:var(--sh2)} .house .sh3{fill:var(--sh3)}
.house .wall{fill:var(--wall)} .house .siding{stroke:var(--wall-2);stroke-width:1}
.house .win{fill:var(--slate-2);stroke:var(--trim);stroke-width:4} .house .mull{stroke:var(--trim);stroke-width:2}
.house .door{fill:var(--brand)} .house .knob{fill:var(--on-brand)}
.house .trim{fill:none;stroke:var(--trim);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.house .chim{fill:var(--wall-2)} .house .chim-cap{fill:var(--trim)}
.house .gnd{stroke:var(--slate-line);stroke-width:2}
.house .anno{fill:none;stroke:var(--brand);stroke-width:2;stroke-dasharray:5 4}
.house .anno-dot{fill:var(--brand)}
.house .anno-t{fill:var(--slate-ink);font:600 15px var(--f-mono)}
.art-cap{font:500 12px/1.4 var(--f-mono);color:var(--slate-muted);letter-spacing:.05em;margin-top:12px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
.hero-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block;max-width:100%}
.tape{height:30px;background-color:var(--brand);color:color-mix(in oklab,var(--on-brand) 78%,var(--brand));position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,currentColor 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,currentColor 0 1.5px,transparent 1.5px 32px),repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 64px);
  background-size:100% 7px,100% 12px,100% 17px;background-repeat:repeat-x}
.tape-n{position:absolute;top:14px;font:600 11px/1 var(--f-mono);color:var(--on-brand);transform:translateX(4px)}
.tape-n.ft{font-weight:600;background:var(--on-brand);color:var(--brand);padding:2px 4px;border-radius:2px;top:12px}

/* sections */
.sec{padding-block:clamp(56px,8vw,96px);scroll-margin-top:72px}
.sec-alt{background:var(--surface);border-block:1px solid var(--line-2)}
.sec-head{display:grid;gap:12px;max-width:760px;margin-bottom:40px}
.h2{font:800 clamp(2rem,4.3vw,3.2rem)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.sec-sub{color:var(--muted);font-size:17px;max-width:62ch}

.svc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
@media (max-width:1080px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.svc-grid{grid-template-columns:minmax(0,1fr)}}
.svc{padding:26px 24px 22px;display:flex;flex-direction:column;gap:10px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.svc-ic{width:42px;height:42px;border-radius:var(--r-sm);background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.svc-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc h3{font:700 23px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin-top:6px}
.svc p{color:var(--muted);font-size:15px}
.svc-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.svc-price{font:500 13px var(--f-mono);color:var(--ink-2)}
.svc .link{font-size:14px}

.life{border-top:1px solid var(--line)}
.life-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:12px 32px;align-items:center;padding-block:20px;border-bottom:1px solid var(--line)}
.life-name strong{display:block;font-weight:600;font-size:17px}
.life-name p{color:var(--muted);font-size:14.5px;margin-top:2px}
.life-yrs{font:600 13px var(--f-mono);color:var(--ink-2);margin-top:6px;display:inline-block}
.life-track{position:relative;height:26px;border-left:1px solid var(--line);border-right:1px solid var(--line);background:linear-gradient(90deg,transparent calc(25% - .5px),var(--line-2) calc(25% - .5px) calc(25% + .5px),transparent calc(25% + .5px) calc(50% - .5px),var(--line-2) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px) calc(75% - .5px),var(--line-2) calc(75% - .5px) calc(75% + .5px),transparent calc(75% + .5px))}
.life-bar{position:absolute;top:7px;height:12px;background:var(--ink-2);border-radius:2px}
.life-scale{position:relative;height:22px;margin-top:8px}
.life-scale span{position:absolute;top:0;font:500 11px var(--f-mono);color:var(--muted);transform:translateX(-50%)}
.life-scale span:first-child{transform:none} .life-scale span:last-child{transform:translateX(-100%)}
.life-scale-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:32px}
@media (max-width:720px){.life-row,.life-scale-row{grid-template-columns:minmax(0,1fr)}.life-scale-row>div:first-child{display:none}}

.steps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink)}
.step{padding:20px 22px 0 0;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:-2px;left:0;width:2px;height:16px;background:var(--ink)}
.step-n{font:800 46px/1 var(--f-display);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.step h3{font:700 21px/1.1 var(--f-display);text-transform:uppercase;margin:12px 0 6px;letter-spacing:.01em}
.step p{color:var(--muted);font-size:15px}
@media (max-width:960px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}}
@media (max-width:540px){.steps{grid-template-columns:minmax(0,1fr)}}

.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:24px}
.proj{min-width:0}
.proj-img,.proj-ph{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;border-radius:var(--r);display:block;background:var(--sunk)}
.proj-ph{background:repeating-linear-gradient(0deg,var(--sh2) 0 12px,var(--sh1) 12px 14px),var(--sh2)}
.proj h3{font:700 22px/1.1 var(--f-display);text-transform:uppercase;margin-top:14px;letter-spacing:.01em}
.proj-meta{font:500 12px/1.5 var(--f-mono);color:var(--muted);letter-spacing:.03em;margin-top:4px}
.proj p{color:var(--ink-2);font-size:15px;margin-top:6px}

.rev-sum{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.rev-score{font:800 64px/.9 var(--f-display);font-variant-numeric:tabular-nums}
.stars{color:var(--accent-ink);letter-spacing:2px;font-size:17px}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rev blockquote{margin:0;font-size:16px;color:var(--ink)}
.rev .who{font-size:14px;color:var(--muted);margin-top:auto}
.rev .who strong{color:var(--ink);font-weight:600}

.assure{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.assure.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:820px){.assure{grid-template-columns:minmax(0,1fr)}}
.as-card{border-radius:var(--r);padding:32px;display:grid;gap:14px;align-content:start;min-width:0}
.as-card.dark{background:var(--slate);color:var(--slate-ink)}
.as-card.light{background:var(--surface);border:1px solid var(--line)}
.big-num{font:800 clamp(64px,8vw,96px)/.82 var(--f-display);font-variant-numeric:tabular-nums}
.as-card.dark .big-num{color:var(--brand)}
.as-card h3{font:700 26px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.as-card.dark p{color:var(--slate-muted)} .as-card.light p{color:var(--muted)}

.contact-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:40px}
@media (max-width:900px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
.area-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.area-chips li{padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:14.5px;background:var(--surface)}
.kv{margin:0}
.kv dt{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:3px 0 18px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.kv dd a{text-decoration:none}
.copy-mini{background:none;border:1px solid var(--line);border-radius:3px;font:500 11px var(--f-mono);padding:2px 6px;cursor:pointer;color:var(--muted)}

.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--ground);padding:12px 0;margin:-8px 0 14px;border-bottom:1px solid var(--line)}

.items{display:grid;gap:12px}

/* catalog */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.cat-tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}

.cat-sw{background:repeating-linear-gradient(0deg,rgb(0 0 0 / .22) 0 2px,transparent 2px 15px),repeating-linear-gradient(90deg,rgb(255 255 255 / .05) 0 26px,transparent 26px 52px),var(--swc)}

/* team & login */
.r-owner{--c:var(--st-insp)} .r-manager{--c:var(--st-new)} .r-worker{--c:var(--st-won)} .r-custom{--c:var(--st-est)}
.steps-list{list-style:none;counter-reset:s;display:grid;gap:12px}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;font-size:14.5px;color:var(--ink-2)}
.steps-list li::before{content:counter(s);font:600 12px/26px var(--f-mono);height:26px;text-align:center;border-radius:3px;background:var(--ink);color:var(--surface)}

.member{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:16px;display:grid;gap:14px;min-width:0}
.member-top{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;justify-content:space-between}
.member-top .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.member-top strong{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.link-state{font:500 11.5px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.perm-grid label{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:14px;cursor:pointer;line-height:1.35;font-weight:600}
.perm-grid label input{margin-top:1px}
.perm-grid small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--ink);color:var(--surface);border:0;border-radius:var(--r-sm);padding:10px 14px;font-weight:600;cursor:pointer}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
#main:focus{outline:none}
.price-note{margin-top:14px}
.form-consent{margin-top:16px;align-items:flex-start}
.form-consent input{margin-top:3px}
.priv-box{margin-top:26px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.priv-box h2{margin-top:0}
.cookie-bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;max-width:720px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;font-size:15px}
.cookie-bar p{flex:1 1 280px;min-width:0}
.cookie-bar a{color:var(--accent-ink);font-weight:600}
.cookie-acts{display:flex;gap:8px;flex-wrap:wrap}
.cookie-acts .btn{min-width:150px}
.ip-list{list-style:none;display:grid;margin-top:14px;border-top:1px solid var(--line-2)}
.ip-list li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ip-list .ip{font:600 14px var(--f-mono);overflow-wrap:anywhere}
.ip-list .sub{color:var(--muted);font-size:13px;flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.login-card{display:grid;gap:16px;text-align:left;width:100%}
.login-page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--ground)}
.login-brand{background:var(--slate);color:var(--slate-ink);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0}
.login-brand-in{padding-block:40px 32px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:grid;gap:28px;align-content:start}
.login-brand h2{font:800 clamp(2.4rem,4.8vw,4rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;max-width:11ch}
.login-brand p{color:var(--slate-muted);max-width:40ch;margin-top:14px;font-size:16px}
.login-art{max-width:440px;width:100%}
.brandmark.on-dark .word b{color:var(--slate-ink)} .brandmark.on-dark .word small{color:var(--slate-muted)}
.brandmark.on-dark .mark .m-bg{fill:var(--slate-2)} .brandmark.on-dark .mark .m-wall{stroke:var(--slate-ink)}
.login-main{display:grid;place-items:center;padding-block:48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.login-box{width:min(440px,100%);display:grid;gap:18px}
.login-box h1{font:800 clamp(36px,4vw,46px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.005em}
.login-box .login-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
@media (max-width:860px){
  .login-page{grid-template-columns:minmax(0,1fr)}
  .login-brand-in{padding-block:24px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px}
  .login-art{display:none}
  .login-brand h2{font-size:2.2rem}
  .login-main{padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
}
.who-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);flex-wrap:wrap}
.who-card img{width:44px;height:44px;border-radius:50%;flex:none}
.who-card strong{display:block;font-weight:600;overflow-wrap:anywhere}
.who-card span.sub{display:block;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.perm-list{list-style:none;display:grid;gap:6px}
.perm-list li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.perm-list svg{width:16px;height:16px;fill:none;stroke:var(--good);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.no-money .lhead,.no-money .lrow{grid-template-columns:minmax(0,1.9fr) minmax(0,1.5fr) minmax(0,1.3fr) 136px 128px}
@media (max-width:900px){.no-money .lrow{grid-template-columns:minmax(0,1fr) auto}}
.dr-fs{border:0;margin:0;padding:0;min-width:0;display:grid;gap:22px}

/* jobs & assignments */
.jobs{display:grid;gap:12px}
.day-h{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.day-h:first-child{margin-top:0}
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.job-top{display:flex;justify-content:space-between;gap:8px 12px;align-items:flex-start;flex-wrap:wrap}
.job-top .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.job h3{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.job .meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.job .meta a{color:var(--ink-2);font-weight:600;text-decoration:none}
.instr{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}

.job .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.job .when{font:600 13px var(--f-mono);color:var(--ink-2)}
.k-chip{font:600 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.stamp{font:500 12px var(--f-mono);color:var(--muted)}
.inline-form{display:grid;gap:10px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2)}
.modal.wide{width:min(640px,100%);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto}
.filters{display:grid;gap:10px;margin-bottom:16px}

/* consent gate + terms */
.terms-wrap{z-index:100}
.terms-modal{width:min(780px,100%);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:0;gap:0}
.terms-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);z-index:1}
.terms{padding:24px 26px 8px;display:grid;gap:6px;max-width:72ch}

.terms h2{font:700 20px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin-top:18px}

.terms-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* welcome page */
.welcome{position:fixed;inset:0;z-index:95;background:var(--slate);color:var(--slate-ink);overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.welcome-in{flex:1 0 auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:44px 36px;width:100%}
.welcome-copy{min-width:0}
.welcome-copy .brandmark{margin-bottom:30px}
.welcome h1{font:800 clamp(2.6rem,6.2vw,5rem)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.005em;margin-top:14px;max-width:14ch}
.welcome .lede{max-width:48ch}
.consent-box{margin-top:30px;padding:18px 20px;border:1px solid var(--slate-line);border-radius:var(--r);background:var(--slate-2);display:grid;gap:14px;max-width:580px}
.consent-box .check-row{align-items:flex-start;color:var(--slate-ink);font-size:15px;line-height:1.5}
.consent-box .check-row input{margin-top:3px;accent-color:var(--brand)}
.consent-box .ferr{color:color-mix(in oklab,var(--bad) 40%,var(--slate-ink))}
.consent-box .acts{display:flex;gap:10px;flex-wrap:wrap}
.on-dark-link{color:color-mix(in oklab,var(--brand) 70%,var(--slate-ink))}
.welcome-art{min-width:0}
.welcome .tape{flex:none}
@media (max-width:900px){.welcome-in{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:28px 24px}.welcome-copy .brandmark{margin-bottom:20px}}

/* floating 3D house */
.h3d{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1.15;perspective:1100px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:var(--r)}
.h3d:active{cursor:grabbing}
.h3d:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.h3d-stage{position:absolute;inset:0;transform-style:preserve-3d}
.h3d-float{position:absolute;left:50%;top:52%;transform-style:preserve-3d;animation:h3dfloat 5s ease-in-out infinite}
.h3d-obj{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.h3d-f{position:absolute;left:0;top:0;backface-visibility:visible}
.h3d-wall{background-color:var(--wall);background-image:repeating-linear-gradient(0deg,transparent 0 9px,color-mix(in oklab,var(--wall-2) 75%,transparent) 9px 10px)}
.h3d-wall.back{filter:brightness(.8)} .h3d-wall.l{filter:brightness(.9)} .h3d-wall.r{filter:brightness(.72)}
.h3d-gable{background:var(--wall);clip-path:polygon(50% 0,100% 100%,0 100%)} .h3d-gable.back{filter:brightness(.8)}
.h3d-roof{background:repeating-linear-gradient(90deg,var(--sh1) 0 11px,var(--sh3) 11px 13px);border-radius:2px;box-shadow:inset 0 0 0 2px var(--sh3)}
.h3d-roof.r{filter:brightness(.78)}
.h3d-chim{background:var(--wall-2)} .h3d-chim.dk{filter:brightness(.78)} .h3d-chim.top{background:var(--sh3)}
.h3d-base{background:color-mix(in oklab,var(--slate-line) 85%,var(--sh1));border-radius:14px;box-shadow:inset 0 0 0 3px color-mix(in oklab,var(--slate-line) 60%,var(--slate-ink))}
.h3d-win{position:absolute;width:30px;height:28px;background:var(--slate-2);border:3px solid var(--trim);border-radius:2px}
.h3d-door{position:absolute;left:50%;bottom:0;width:30px;height:50px;margin-left:-15px;background:var(--brand);border:3px solid var(--trim);border-bottom:0;border-radius:2px 2px 0 0}
.h3d-shadow{position:absolute;left:19%;right:19%;bottom:5%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgb(0 0 0 / .38),transparent);animation:h3dshadow 5s ease-in-out infinite;pointer-events:none}
@keyframes h3dfloat{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
@keyframes h3dshadow{0%,100%{transform:scale(.86);opacity:.65}50%{transform:scale(1);opacity:1}}

/* mobile */
.menu-wrap{position:relative;display:none}
@media (max-width:1020px){.menu-wrap{display:block}}

.mbar{display:none}
@media (max-width:720px){#site-root:not(.has-preview) .head-cta>.btn-brand{display:none}}
@media (max-width:720px){
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:color-mix(in oklab,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgb(16 24 32 / .08)}

function collectDrawer() {

  const map = { 'd-name': 'name', 'd-phone': 'phone', 'd-email': 'email', 'd-address': 'address', 'd-pref': 'contactPref', 'd-source': 'source', 'd-service': 'service', 'd-roof': 'roofType', 'd-urgency': 'urgency', 'd-stage': 'stage', 'd-kind': 'apptKind', 'd-date': 'apptDate', 'd-time': 'apptTime', 'd-msg': 'message', 'd-lost': 'lostReason' };

function dbErr(e) {
  const c = e && e.code;
  if (c === 'invalid_argument') return 'You don’t have permission to make that change, or the item no longer exists.';
  if (c === 'quota_exceeded') return 'Storage is full. Delete old leads or jobs to make room.';
  if (c === 'resource_exhausted') return 'The server is busy with too many changes. Wait a moment and try again.';
  if (c === 'rate_local') return 'You’re making changes very quickly. Wait a few seconds and try again.';
  if (c === 'timeout') return 'The server took too long to answer. Check your connection and try again.';
  if (c === 'offline') return 'You’re offline. Reconnect to the internet and try again.';
  if (c === 'unavailable') return 'The server is busy right now. Try again in a moment.';

}
async function saveLead() {
  collectDrawer();
  const dr = st.drawer; if (!dr || dr.saving) return;
  const l = dr.data;
  if (!l.name) { toast('Add the customer’s name first.'); const f = $('#d-name'); if (f) f.focus(); return; }
  if (!dr.id && !dr.dupOk) { const ex = findDup(l); if (ex) { dr.dup = ex.id; renderDrawer(); const b = $('[data-action="lead-save-anyway"]'); if (b) b.focus(); return; } }
  const now = Date.now();
  if (WON.indexOf(l.stage) >= 0 && !l.wonAt) l.wonAt = now;
  if (l.stage === 'completed' && !l.completedAt) l.completedAt = now;
  if (l.stage === 'estimate' && !l.estimateAt) l.estimateAt = now;
  if (l.stage !== 'lost') delete l.lostReason;
  if (!l.createdAt) l.createdAt = now;
  l.updatedAt = now;
  let body = clone(l); delete body.id;
  if (Array.isArray(body.notes) && body.notes.length > NOTES_CAP) body.notes = body.notes.slice(-NOTES_CAP);
  if (!dr.id && dr.dup) body.possibleDuplicateOf = dr.dup;
  dr.saving = true; renderDrawer();
  try {
    let merged = false;
    if (dr.id) {
      const cur = await C.db.doc(LEADS + '/' + dr.id).get();
      if (!cur.exists) { dr.saving = false; renderDrawer(); toast('Someone deleted this lead while you were editing it.'); return; }
      const latest = cur.data() || {}, o = dr.orig || {};
      if (num(latest.updatedAt) !== num(o.updatedAt)) {
        const out = clone(latest);
        Object.keys(body).forEach(k => { if (k === 'notes' || k === 'updatedAt') return; if (JSON.stringify(body[k]) !== JSON.stringify(o[k])) out[k] = body[k]; });
        Object.keys(o).forEach(k => { if (k !== 'id' && k !== 'notes' && !(k in body) && (k in out)) delete out[k]; });
        out.notes = mergeNotes(latest.notes, body.notes, o.notes);
        out.updatedAt = now; body = out; merged = true;
      }
    }
    const ref = dr.id ? C.db.doc(LEADS + '/' + dr.id) : C.db.collection(LEADS).doc();
    await ref.set(body);
    const wasNew = !dr.id;
    st.drawer = null; renderDrawer();
    toast(wasNew ? 'Lead added.' : merged ? 'Saved. Someone else changed this lead at the same time, and both sets of changes were kept.' : 'Changes saved.');
  } catch (e) { dr.saving = false; renderDrawer(); toast(dbErr(e)); }
}
async function deleteLead() {
  const dr = st.drawer; if (!dr || !dr.id) return;

function estDefaults() {
  const m = (PR().materials[0] || {}).id || '';
  return { footprint: 2000, L: '', W: '', pitch: 6, waste: 10, material: m, layers: 1, stories: 1, ridge: 40, drip: 180, ice: 4, skylights: 0, chimneys: 1, boots: 3, permit: true, leadId: '', markSent: true };

function calcEst(e, P) {

  const mats = P.materials || [];

  const lines = [], add = (label, amt) => { if (amt > 0) lines.push({ label, amt: Math.round(amt * 100) / 100 }); };
  const matAmt = sq * num(mat.perSq);
  add(mat.name + ': ' + f1(sq) + ' sq × ' + money(mat.perSq), matAmt);
  const layers = num(e.layers);
  if (layers > 0 && sq > 0) {
    add('Tear-off, ' + layers + ' layer' + (layers > 1 ? 's' : '') + ': ' + f1(sq) + ' sq × ' + money(P.tearoff) + (layers > 1 ? ' × ' + layers : ''), sq * num(P.tearoff) * layers);

  if (stories > 1 && sq > 0) add('Height access, ' + stories + ' stories: ' + f1(sq) + ' sq × ' + money(P.story) + (stories > 2 ? ' × ' + (stories - 1) : ''), sq * num(P.story) * (stories - 1));
  add('Ridge vent: ' + num(e.ridge) + ' lf × ' + money(P.ridgeVent, true), num(e.ridge) * num(P.ridgeVent));
  add('Drip edge: ' + num(e.drip) + ' lf × ' + money(P.dripEdge, true), num(e.drip) * num(P.dripEdge));
  add('Ice & water shield: ' + num(e.ice) + ' sq × ' + money(P.iceWater), num(e.ice) * num(P.iceWater));
  add('Skylight re-flash × ' + num(e.skylights), num(e.skylights) * num(P.skylight));
  add('Chimney flashing × ' + num(e.chimneys), num(e.chimneys) * num(P.chimney));
  add('Pipe boots × ' + num(e.boots), num(e.boots) * num(P.pipeBoot));

  return { factor, area, sqRaw, sq, bundles: mat.shingle ? Math.ceil(sqRaw * 3 - 1e-9) : null, mat, lines, subtotal, tax, total: subtotal + tax };
}

async function saveEstimate() {

async function createAccount() {
  if (st.creatingAcc) return;
  const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const name = v('acc-name'), user = v('acc-user').toLowerCase(), role = v('acc-role'), pass = (document.getElementById('acc-pass') || {}).value || '';
  st.accForm = { name, user, role, pass };
  const err = m => { st.accErr = m; renderMain(true); };
  if (!name) return err('Add the employee’s name.');
  if (!/^[a-z0-9._-]{3,32}$/.test(user)) return err('Usernames need 3 to 32 letters, numbers, dots, dashes or underscores, with no spaces.');
  if ((C.accounts || []).some(a => String(a.username || '').toLowerCase() === user)) return err('That username is taken. Pick another.');
  if (!roleById(role)) return err('Pick a role.');
  const pp = pwProblem(pass, user); if (pp) return err(pp);
  st.accErr = ''; st.creatingAcc = true;
  try {
    const salt = randHex(16), hash = await hashPw(pass, salt, PW_ITER), now = Date.now();
    await C.db.doc(ACCOUNTS + '/a' + uid()).set({ username: user, name, role, salt, hash, iter: PW_ITER, banned: false, createdAt: now, updatedAt: now, createdBy: myKey(), createdByName: C.name || roleName(roleKey()), userId: null, lastLoginAt: null });
    st.accForm = null; renderMain(true);
    toast('Account created. Give ' + name + ' the username “' + user + '” and the password.');
  } catch (e) { err(e && e.code ? dbErr(e) : 'This browser can’t create passwords. Try an up-to-date browser.'); }
  finally { st.creatingAcc = false; }
}
async function resetPassword(id) {
  const inp = document.getElementById('rp-' + id), pass = inp ? inp.value : '';

  } catch (e) { toast(e && e.code ? dbErr(e) : 'Couldn’t change the password in this browser.'); }
}
